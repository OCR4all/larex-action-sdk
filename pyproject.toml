[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "larex-action-sdk"
version = "0.6.1"
description = "Framework-neutral Python SDK for building LAREX Action processors."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "OCR4all" }
]
keywords = ["larex", "ocr", "actions", "processors"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed"
]
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
fastapi = [
  "fastapi>=0.115,<1"
]

[project.urls]
Homepage = "https://github.com/OCR4all/larex-action-sdk"
Repository = "https://github.com/OCR4all/larex-action-sdk"
Issues = "https://github.com/OCR4all/larex-action-sdk/issues"

[dependency-groups]
dev = [
  "fastapi>=0.115,<1",
  "pyright>=1.1.407",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1"
]

[tool.hatch.build.targets.wheel]
packages = ["src/larex_actions"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "PTH", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
